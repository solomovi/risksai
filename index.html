        opacity: 1;
        transform: translateY(0);
      }

      animation: fadeSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;

      screen: 'intro', // 'intro' | 'stage' | 'summary'
      stageIndex: 0,   // 0, 1, 2
      selectedOptionKey: null,
      metrics: { ...INITIAL_METRICS },
      history: []      // Array of { stageId, stageTitle, option }
    };

    const appContainer = document.getElementById('app-container');

    /**
     * Clamps numeric values between 0 and 100
     */
    function clampScore(val) {
      return Math.max(0, Math.min(100, val));
    }

    /**
     * Returns color utility classes based on score threshold:
     * < 35%: red, 35-64%: amber, >= 65%: emerald
     */
    function getThresholdClasses(score) {
      if (score < 35) {
        return {
          bar: 'bg-rose-500',
          text: 'text-rose-400',
          lightText: 'text-rose-600',
          lightBg: 'bg-rose-50 border-rose-200'
        };
      } else if (score < 65) {
        return {
          bar: 'bg-amber-400',
          text: 'text-amber-400',
          lightText: 'text-amber-600',
          lightBg: 'bg-amber-50 border-amber-200'
        };
      } else {
        return {
          bar: 'bg-emerald-400',
          text: 'text-emerald-400',
          lightText: 'text-emerald-600',
          lightBg: 'bg-emerald-50 border-emerald-200'
        };
      }
    }

    /**
     * Updates the top 3 KPI bars and optionally animates +/- delta badges
     */
    function updateKPIHeader(deltas = null) {
      const keys = ['trust', 'ethics', 'stability'];
      keys.forEach((key) => {
        const val = state.metrics[key];
        const barEl = document.getElementById(`bar-${key}`);
        const valEl = document.getElementById(`val-${key}`);
        const deltaEl = document.getElementById(`delta-${key}`);
        const colors = getThresholdClasses(val);

        barEl.style.width = `${val}%`;
        barEl.className = `h-full ${colors.bar} rounded-full transition-all duration-500 ease-out`;

        valEl.textContent = `${val}%`;
        valEl.className = `font-bold text-sm tabular-nums ${colors.text}`;

        if (deltas && typeof deltas[key] === 'number') {
          const d = deltas[key];
          const sign = d > 0 ? '+' : '';
          deltaEl.textContent = `${sign}${d}%`;
          deltaEl.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-300', 'bg-rose-500/20', 'text-rose-300', 'bg-slate-600', 'text-slate-200', 'animate-delta');
          void deltaEl.offsetWidth; // trigger reflow for animation restart
          if (d > 0) {
            deltaEl.classList.add('bg-emerald-500/25', 'text-emerald-300', 'animate-delta');
          } else if (d < 0) {
            deltaEl.classList.add('bg-rose-500/25', 'text-rose-300', 'animate-delta');
          } else {
            deltaEl.classList.add('bg-slate-600', 'text-slate-200', 'animate-delta');
          }
        } else {
          deltaEl.classList.add('hidden');
        }
      });
    }

    /**
     * Starts the simulation from Screen 0 -> Stage 1
     */
    function startSimulation() {
      state.screen = 'stage';
      state.stageIndex = 0;
      state.selectedOptionKey = null;
      render();
    }

    /**
     * Handles student choice in the current stage
     */
    function selectOption(optionKey) {
      if (state.selectedOptionKey !== null) return; // prevent double click

      const currentStage = STAGES[state.stageIndex];
      const chosenOption = currentStage.options.find(o => o.key === optionKey);
      if (!chosenOption) return;

      state.selectedOptionKey = optionKey;
      state.metrics.trust = clampScore(state.metrics.trust + chosenOption.deltas.trust);
      state.metrics.ethics = clampScore(state.metrics.ethics + chosenOption.deltas.ethics);
      state.metrics.stability = clampScore(state.metrics.stability + chosenOption.deltas.stability);

      state.history.push({
        stageId: currentStage.id,
        stageTitle: currentStage.title,
        option: chosenOption
      });

      updateKPIHeader(chosenOption.deltas);
      render();
    }

    /**
     * Advances to next stage or final performance summary
     */
    function nextStep() {
      if (state.stageIndex < STAGES.length - 1) {
        state.stageIndex += 1;
        state.selectedOptionKey = null;
        render();
      } else {
        state.screen = 'summary';
        render();
      }
    }

    /**
     * Resets entire simulation back to Screen 0 with 50% baseline metrics
     */
    function resetSimulation() {
      state = {
        screen: 'intro',
        stageIndex: 0,
        selectedOptionKey: null,
        metrics: { ...INITIAL_METRICS },
        history: []
      };
      updateKPIHeader(null);
      render();
    }

            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3.5 border-b border-slate-100">
              <div>
                <span class="text-xs font-bold text-indigo-600 uppercase tracking-wide">דוח סיכום ביצועים אישי</span>
                <h2 class="text-lg sm:text-xl font-extrabold text-slate-900">הערכת ניהול המשבר – "סייבר-פלוס"</h2>
              </div>
              <span class="px-3 py-1 rounded-full text-xs sm:text-sm font-bold border ${profileBadgeClass}">
                ${profileTitle}
              </span>
            </div>

            <!-- Final 3 KPI Scores -->
            <div class="grid grid-cols-3 gap-3 mb-3.5">
              ${kpiCards}
            </div>

            <!-- Academic Takeaway -->
            <div class="bg-slate-50 border-r-4 border-navy-900 rounded-xl p-3.5 mb-3.5">
              <div class="text-xs font-bold text-navy-900 mb-1">ניתוח מסכם לאור תיאוריית SCCT (קומבס):</div>
              <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">
                ${profileSummary}
              </p>
            </div>

            <!-- 3-Step Decision Recap -->
            <div class="mb-4">
              <div class="text-xs font-bold text-slate-500 mb-1.5">סקירת ההחלטות שקיבלת לאורך שלבי המשבר:</div>
              <div class="space-y-1.5">
                ${recapHtml}
              </div>
            </div>
          </div>

          <!-- Restart Button -->
          <div class="flex items-center justify-between pt-3 border-t border-slate-100">
            <span class="text-xs text-slate-500 hidden sm:inline">ניתן לחזור על הסימולציה כדי לבחון אסטרטגיות תגובה חלופיות.</span>
            <button
              onclick="resetSimulation()"
              class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-navy-900 hover:bg-indigo-900 active:scale-[0.99] text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-sm transition-all cursor-pointer">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span>התחל סימולציה מחדש</span>
            </button>
          </div>
        </section>
      `;
    }

    /**
     * Main Render Dispatcher
     */
    function render() {
      if (state.screen === 'intro') {
        appContainer.innerHTML = renderIntroScreen();
      } else if (state.screen === 'stage') {
        appContainer.innerHTML = renderStageScreen();
      } else {
        appContainer.innerHTML = renderSummaryScreen();
      }
    }

    // Initialize App on Load
    window.addEventListener('DOMContentLoaded', () => {
      updateKPIHeader(null);
      render();
    });
  </script>
</body>
</html>
